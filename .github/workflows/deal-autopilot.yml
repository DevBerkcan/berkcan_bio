name: Deal-Autopilot

# Alle 30 Minuten: neue Amazon-Deals (mydealz-RSS) finden → Telegram posten →
# data/auto-deals.json aktualisieren (erscheint automatisch auf /deals).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Nur testen (nichts posten)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deal-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Autopilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            node scripts/autopilot.mjs --dry; exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "::warning::Secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID fehlen – Autopilot pausiert"
            node scripts/autopilot.mjs --dry; exit 0
          fi
          node scripts/autopilot.mjs

      - name: Deals speichern
        run: |
          git config user.name "deal-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-deals.json data/autopilot-state.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "chore(autopilot): Deals aktualisiert [skip ci]"
          git pull --rebase --autostash origin main
          git push
