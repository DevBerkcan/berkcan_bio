name: Deal-Autopilot

# Alle 15 Minuten (Skript entscheidet je nach Modus, ob gepostet wird):
# Deal-Inbox lesen → neue Amazon-Deals (mydealz-RSS) finden → Telegram posten →
# data/auto-deals.json aktualisieren (erscheint automatisch auf /deals).
#
# Zuverlässigkeit: GitHub-Zeitpläne starten oft verspätet oder gar nicht. Darum stößt
# jeder Lauf nach 15 Min selbst den nächsten an (Job "next"). Der Zeitplan ist die Reserve.
# Stoppen: data/deals.json → autopilot.enabled = false (oder Workflow in GitHub deaktivieren).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Nur testen (nichts posten, keine Kette)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: deal-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfiguration
        id: cfg
        run: echo "enabled=$(node -p "require('./data/deals.json').autopilot?.enabled === true")" >> "$GITHUB_OUTPUT"

      - name: Autopilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            node scripts/autopilot.mjs --dry; exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "::warning::Secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID fehlen – Autopilot pausiert"
            node scripts/autopilot.mjs --dry; exit 0
          fi
          node scripts/autopilot.mjs

      - name: Deals speichern
        run: |
          git config user.name "deal-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/auto-deals.json data/autopilot-state.json data/queue.json data/queue
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "chore(autopilot): Deals aktualisiert [skip ci]"
          git pull --rebase --autostash origin main
          git push

      - name: Fehler-Alarm
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: >
          node scripts/alert.mjs "Ein Autopilot-Lauf ist fehlgeschlagen. Details:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  next:
    needs: run
    if: ${{ always() && github.event.inputs.dry != 'true' && needs.run.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 15 Minuten warten und nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 840
          gh workflow run deal-autopilot.yml --repo "${{ github.repository }}" --ref main

      - uses: actions/checkout@v4
        if: ${{ failure() }}

      - name: Fehler-Alarm (Kette unterbrochen)
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: >
          node scripts/alert.mjs "Der nächste Lauf konnte nicht gestartet werden – der Bot steht still.
          Bitte in GitHub unter Actions → Deal-Autopilot → Run workflow neu starten:
          ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deal-autopilot.yml"
